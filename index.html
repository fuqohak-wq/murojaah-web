<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tashih Murojaah Studio</title>
    <script src="https://cdn.tailwindcss.com/3.4.15"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }
        .font-arabic { 
            font-family: 'Amiri', serif !important; 
            direction: rtl;
        }
    </style>
</head>
<body class="p-4 md:p-8 lg:p-12 text-slate-900">

<div class="max-w-4xl mx-auto space-y-8">
    <!-- Header -->
    <div class="text-center space-y-2">
        <h1 class="text-3xl font-extrabold text-emerald-700 tracking-tight">AI Tashih Murojaah Studio</h1>
        <p class="text-sm text-slate-500 font-medium">Uji akurasi hafalan Al-Qur'an Anda secara real-time menggunakan kecerdasan buatan.</p>
    </div>

    <!-- Main Card -->
    <div class="bg-white rounded-[2rem] border border-slate-200 p-6 md:p-10 shadow-sm space-y-6">
        <div>
            <label class="text-[11px] font-black uppercase text-slate-400 mb-2 block tracking-wider">Petunjuk Nama Surah (Opsional)</label>
            <input type="text" id="surahHint" class="w-full p-4 rounded-xl text-sm font-semibold bg-slate-50 border border-slate-300 focus:border-emerald-500 focus:bg-white outline-none transition" placeholder="Contoh: Al-Baqarah, Juz 30, atau An-Naba">
        </div>

        <!-- Area Drop/Upload File -->
        <div class="p-8 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center gap-3 relative">
            <input type="file" id="audioInput" accept="audio/*" class="hidden">
            <label for="audioInput" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl text-sm cursor-pointer transition shadow-md">
                Pilih File Audio (MP3/WAV/M4A)
            </label>
            <p id="fileName" class="text-xs text-slate-500 font-medium mt-1">Belum ada file yang dipilih</p>
        </div>

        <!-- Progress Bar (Hidden by Default) -->
        <div id="progressContainer" class="hidden space-y-2">
            <div class="flex justify-between text-xs font-bold text-slate-500">
                <span id="progressStatus">Mengunggah file ke server...</span>
                <span id="progressPercentage">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-150"></div>
            </div>
        </div>

        <!-- Tombol Kirim -->
        <button id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl transition shadow-lg text-sm tracking-wider uppercase">
            Mulai Tashih Hafalan 🎙️
        </button>
    </div>

    <!-- Kontainer Hasil Analisis -->
    <div id="resultContainer" class="hidden bg-white rounded-[2rem] border border-slate-200 p-6 md:p-10 shadow-sm space-y-6">
        <h2 class="text-xl font-bold text-emerald-800 border-b pb-4">Hasil Tashih Hafalan</h2>
        
        <div id="formattedResult" class="space-y-6">
            <!-- Hasil parsing sistem akan disisipkan di sini -->
        </div>
    </div>
</div>

<script>
    // Konfigurasi endpoint backend FastAPI Anda
    const BACKEND_URL = window.location.origin + "/upload";

    const audioInput = document.getElementById('audioInput');
    const fileNameDisplay = document.getElementById('fileName');
    const btnSubmit = document.getElementById('btnSubmit');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressPercentage = document.getElementById('progressPercentage');
    const progressStatus = document.getElementById('progressStatus');
    const resultContainer = document.getElementById('resultContainer');
    const formattedResult = document.getElementById('formattedResult');

    audioInput.onchange = () => {
        if (audioInput.files.length > 0) {
            fileNameDisplay.innerText = audioInput.files[0].name;
        } else {
            fileNameDisplay.innerText = "Belum ada file yang dipilih";
        }
    };

    btnSubmit.onclick = () => {
        const file = audioInput.files[0];
        if (!file) {
            alert("Silakan pilih file audio terlebih dahulu!");
            return;
        }

        const surahHint = document.getElementById('surahHint').value;
        const formData = new FormData();
        formData.append("file", file);
        if (surahHint) {
            formData.append("surah_hint", surahHint);
        }

        // Tampilkan Indikator Progress
        progressContainer.classList.remove('hidden');
        resultContainer.classList.add('hidden');
        btnSubmit.disabled = true;
        btnSubmit.classList.add('opacity-50');

        progressBar.style.width = '0%';
        progressPercentage.innerText = '0%';
        progressStatus.innerText = "Mengunggah berkas audio...";

        const xhr = new XMLHttpRequest();
        xhr.open("POST", BACKEND_URL, true);

        // Memantau proses pengiriman data (upload progress)
        xhr.upload.addEventListener("progress", (e) => {
            if (e.lengthComputable) {
                const percentComplete = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percentComplete + '%';
                progressPercentage.innerText = percentComplete + '%';
                if (percentComplete === 100) {
                    progressStatus.innerText = "Audio terkirim! AI sedang menyimak hafalan Anda...";
                    progressBar.classList.remove('bg-emerald-500');
                    progressBar.classList.add('bg-blue-500');
                }
            }
        });

        xhr.onload = () => {
            btnSubmit.disabled = false;
            btnSubmit.classList.remove('opacity-50');
            progressContainer.classList.add('hidden');

            if (xhr.status === 200) {
                const response = JSON.parse(xhr.responseText);
                if (response.status === "success") {
                    displayResult(response.result);
                } else {
                    alert("Error dari AI: " + response.message);
                }
            } else {
                alert("Gagal menghubungi server backend.");
            }
        };

        xhr.onerror = () => {
            btnSubmit.disabled = false;
            btnSubmit.classList.remove('opacity-50');
            progressContainer.classList.add('hidden');
            alert("Koneksi ke backend terputus atau gagal.");
        };

        xhr.send(formData);
    };

    function displayResult(rawText) {
        resultContainer.classList.remove('hidden');
        formattedResult.innerHTML = "";

        // Pisahkan teks hasil berdasarkan pemisah utama (garis pembatas ganda)
        const parts = rawText.split("=========================================");
        
        let ayatTerakhirHTML = "";
        let cakupanHTML = "";
        let koreksiHTML = "";

        // Bagian 1: Ayat Terakhir yang Dibaca
        if (parts[0]) {
            const cleanText = parts[0].replace("🏁 AYAT TERAKHIR YANG BACA:", "").trim();
            const lines = cleanText.split("\n");
            const headerInfo = lines[0] || "";
            const arabicText = lines.slice(1).join("\n") || "";

            ayatTerakhirHTML = `
                <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 space-y-3">
                    <div class="text-[10px] font-black tracking-widest text-emerald-800 uppercase">🏁 AYAT TERAKHIR YANG DIBACA</div>
                    <div class="text-sm font-bold text-slate-700">${headerInfo}</div>
                    <div class="font-arabic text-2xl text-emerald-950 pt-2 leading-relaxed text-right">${arabicText}</div>
                </div>
            `;
        }

        // Bagian 2: Cakupan Bacaan
        if (parts[1]) {
            const cleanText = parts[1].replace("📖 CAKUPAN BACAAN:", "").trim();
            cakupanHTML = `
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6">
                    <div class="text-[10px] font-black tracking-widest text-slate-500 uppercase mb-2">📖 CAKUPAN BACAAN</div>
                    <p class="text-sm font-semibold text-slate-700">${cleanText}</p>
                </div>
            `;
        }

        // Bagian 3: Detail Koreksi
        if (parts[2]) {
            const cleanText = parts[2].replace("⚠️ DETAIL KOREKSI (TEKS ARAB):", "").trim();
            
            let itemsHTML = "";
            if (cleanText.includes("Lancar Sempurna")) {
                itemsHTML = `
                    <div class="p-4 bg-emerald-100 text-emerald-800 rounded-xl font-bold text-sm text-center">
                        🎉 Selamat, Hafalan Lancar Sempurna!
                    </div>
                `;
            } else {
                // Parse setiap baris koreksi yang diawali tanda bulat (●)
                const items = cleanText.split("●");
                items.forEach(item => {
                    if (item.trim() === "") return;
                    
                    const lines = item.trim().split("\n");
                    const metaInfo = lines[0] || ""; // Contoh: Al-Mulk Ayat 5 (Menit 01:23)
                    
                    let detailBody = "";
                    lines.slice(1).forEach(line => {
                        detailBody += `<p class="text-xs text-slate-600 my-1">${line}</p>`;
                    });

                    itemsHTML += `
                        <div class="border-l-4 border-amber-500 bg-amber-50/50 p-4 rounded-r-xl space-y-2">
                            <div class="text-xs font-extrabold text-amber-800">${metaInfo}</div>
                            <div class="space-y-1">${detailBody}</div>
                        </div>
                    `;
                });
            }

            koreksiHTML = `
                <div class="space-y-3">
                    <div class="text-[10px] font-black tracking-widest text-red-600 uppercase">⚠️ DETAIL KOREKSI (TEKS ARAB)</div>
                    <div class="space-y-3">${itemsHTML}</div>
                </div>
            `;
        }

        formattedResult.innerHTML = ayatTerakhirHTML + cakupanHTML + koreksiHTML;
    }
</script>

</body>
</html>
